name: Build WinTidy

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller sv-ttk
      - run: pyinstaller --onefile --windowed --uac-admin --icon WinTidy.ico --add-data "WinTidy.ico;." --collect-data sv_ttk --name WinTidy wintidy.py
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" WinTidy.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: WinTidy-Setup
          path: installer/WinTidy-Setup.exe
